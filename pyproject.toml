[project]
name = "resume-builder"
version = "0.1.0"
description = "Codex-powered interactive resume tailoring and review CLI"
requires-python = ">=3.12"
dependencies = [
    "openai-codex>=0.144.4",
    "pypdf>=6.14.2",
    "rich>=15.0.0",
    "typer>=0.27.1",
]

[project.scripts]
resume = "resume_cli.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resume_cli"]
